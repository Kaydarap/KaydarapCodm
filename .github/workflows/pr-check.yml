# Every pull request: content check + full build. The built site is attached
# to the run as a downloadable "site-preview" artifact (unzip, then
# `npx serve site-preview` to review it locally before merging).
name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 7
